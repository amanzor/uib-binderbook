<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>MAX by UIB - Quick Car Insurance Quote</title>
    <meta name="description" content="Get a car insurance quote in 2 minutes. Snap your license and VIN and a Universal Insurance Brokers agent will call you.">

    <!-- App install (PWA) + native wrappers load this same page -->
    <link rel="manifest" href="/max/manifest.webmanifest">
    <meta name="theme-color" content="#0d1f3c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MAX">
    <link rel="apple-touch-icon" href="/icons/rater-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/rater-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy:#0d1f3c; --blue:#1d4ed8; --blue-light:#3b82f6; --blue-pale:#eff6ff; --green:#059669; --green-pale:#ecfdf5;
            --red:#dc2626; --red-pale:#fef2f2; --purple:#7c3aed; --amber:#d97706;
            --gray-50:#f8fafc; --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-300:#cbd5e1; --gray-500:#64748b; --gray-700:#334155; --gray-900:#0f172a; --white:#fff;
            --radius-md:10px; --radius-lg:16px; --radius-xl:22px;
            --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05); --shadow-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.05);
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; }
        body { font-family:'Inter','Segoe UI',system-ui,sans-serif; background: var(--gray-50); color: var(--gray-900); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100vh; }

        .hdr { background: linear-gradient(135deg,#0d1f3c 0%,#163057 55%,#1d4ed8 100%); color:#fff; padding: calc(12px + env(safe-area-inset-top)) 18px 12px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:10; box-shadow:0 2px 12px rgba(0,0,0,.2); }
        .hdr img { height:28px; width:auto; border-radius:6px; }
        .hdr .t { font-family:'Plus Jakarta Sans','Inter',sans-serif; font-weight:800; font-size:18px; letter-spacing:-.2px; white-space:nowrap; }
        .hdr .s { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .hdr .txtblk { min-width:0; }
        @media (max-width: 480px) {
            .hdr { padding-left:12px; padding-right:12px; gap:8px; }
            .hdr .s { display:none; }
            .hdr button { padding:7px 9px; font-size:12px; }
            .hdr button.restart { width:34px; padding:7px 0; text-align:center; }
        }
        .hdr .s { font-size:11px; opacity:.75; margin-top:-2px; }
        .hdr .spacer { flex:1; }
        .hdr button { background: rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:6px 10px; font-size:12px; font-weight:600; font-family:inherit; cursor:pointer; white-space:nowrap; }
        .hdr button.dealer { background: linear-gradient(to right,#024b36 0%,#059669 60%,#10b981 100%); border-color: rgba(255,255,255,.35); }
        .form { background:#fff; border:1px solid var(--gray-200); border-radius: var(--radius-lg); padding:16px; box-shadow: var(--shadow-sm); display:flex; flex-direction:column; gap:10px; }
        .form h2 { font-family:'Plus Jakarta Sans','Inter',sans-serif; color: var(--navy); font-size:19px; }
        .form p { font-size:13.5px; color: var(--gray-500); margin-top:-4px; }
        .form label { font-size:12.5px; font-weight:700; color: var(--gray-700); display:block; margin-bottom:4px; }
        .form input { width:100%; padding:12px 13px; border:1.5px solid var(--gray-200); border-radius:10px; font-family:inherit; font-size:16px; }
        .form input:focus { outline:none; border-color: var(--blue-light); box-shadow:0 0 0 3px rgba(59,130,246,.15); }
        .form .err { color: var(--red); font-size:13px; font-weight:600; }

        .wrap { flex:1; display:flex; flex-direction:column; max-width:720px; width:100%; margin:0 auto; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); }

        /* bot */
        .hero { display:flex; align-items:center; gap:14px; padding:6px 4px 10px; }
        .hero .txt b { display:block; font-family:'Plus Jakarta Sans','Inter',sans-serif; font-size:20px; color:var(--navy); letter-spacing:-.3px; }
        .hero .txt span { font-size:13px; color:var(--gray-500); }
        .max-bot { position:relative; width:84px; height:104px; flex:0 0 84px; animation: maxFloat 4s ease-in-out infinite; transform-origin:center; }
        .max-bot .antenna { position:absolute; left:50%; top:0; width:4px; height:14px; margin-left:-2px; background:linear-gradient(90deg,#94a3b8,#e2e8f0,#64748b); border-radius:2px; }
        .max-bot .antenna span { position:absolute; left:50%; top:-6px; width:10px; height:10px; margin-left:-5px; border-radius:50%; background: radial-gradient(circle at 35% 35%, #fde68a, #f59e0b 60%, #b45309); box-shadow:0 0 10px rgba(245,158,11,.8); animation: maxBlink 2.2s ease-in-out infinite; }
        .max-bot .head { position:absolute; left:8px; top:12px; width:68px; height:52px; border-radius:18px; background: radial-gradient(ellipse at 30% 25%, #fff 0%, #dbe4f3 35%, #8ea2c4 75%, #51688e 100%); box-shadow: inset -5px -6px 10px rgba(13,31,60,.25), inset 4px 4px 8px rgba(255,255,255,.7), 0 10px 16px -8px rgba(13,31,60,.55); }
        .max-bot .visor { position:absolute; left:8px; top:11px; width:52px; height:24px; border-radius:13px; background: linear-gradient(180deg,#0d1f3c,#1e3a8a 60%,#1d4ed8); box-shadow: inset 0 2px 5px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; gap:10px; }
        .max-bot .eye { width:10px; height:10px; border-radius:50%; background: radial-gradient(circle at 40% 40%, #fff, #67e8f9 40%, #06b6d4 70%, #0e7490); box-shadow:0 0 8px rgba(103,232,249,.9); animation: maxEye 3.4s ease-in-out infinite; }
        .max-bot .mouth { position:absolute; left:26px; bottom:7px; width:16px; height:4px; border-radius:2px; background: linear-gradient(90deg,#1d4ed8,#67e8f9,#1d4ed8); }
        .max-bot .neck { position:absolute; left:36px; top:63px; width:12px; height:7px; background:linear-gradient(90deg,#64748b,#cbd5e1,#64748b); border-radius:3px; }
        .max-bot .body { position:absolute; left:16px; top:69px; width:52px; height:30px; border-radius:15px 15px 10px 10px; background: radial-gradient(ellipse at 30% 20%, #fff 0%, #c7d2fe 35%, #1d4ed8 80%, #0d1f3c 100%); box-shadow: inset -5px -5px 10px rgba(13,31,60,.35), inset 4px 4px 8px rgba(255,255,255,.5), 0 10px 16px -8px rgba(13,31,60,.55); }
        .max-bot .core { position:absolute; left:50%; top:9px; width:12px; height:12px; margin-left:-6px; border-radius:50%; background: radial-gradient(circle at 40% 40%, #fff, #a5b4fc 40%, #7c3aed 75%, #3b1a8c); box-shadow:0 0 10px rgba(124,58,237,.8); animation: maxBlink 2.8s ease-in-out infinite; }
        .max-bot.thinking .eye { animation: maxBlink .7s ease-in-out infinite; }
        @keyframes maxFloat { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-5px);} }
        @keyframes maxBlink { 0%,100% { opacity:1;} 50% { opacity:.55;} }
        @keyframes maxEye { 0%,88%,100% { transform: scaleY(1);} 92%,96% { transform: scaleY(.15);} }

        /* progress */
        .steps { display:flex; gap:4px; margin:4px 0 12px; }
        .steps i { flex:1; height:5px; border-radius:3px; background: var(--gray-200); }
        .steps i.on { background: linear-gradient(90deg,#1d4ed8,#06b6d4); }

        /* chat */
        .log { flex:1; display:flex; flex-direction:column; gap:10px; padding-bottom:8px; }
        .msg { max-width:88%; padding:11px 14px; border-radius:16px; font-size:15px; line-height:1.45; white-space:pre-wrap; word-break:break-word; animation: pop .18s ease-out; }
        .msg.bot { align-self:flex-start; background:#fff; border:1px solid var(--gray-200); border-bottom-left-radius:4px; box-shadow: var(--shadow-sm); }
        .msg.user { align-self:flex-end; background: linear-gradient(135deg,#0d1f3c,#1d4ed8); color:#fff; border-bottom-right-radius:4px; }
        .msg.err { background: var(--red-pale); border-color:#fecaca; color:#991b1b; }
        .msg img.ph { max-width:200px; max-height:150px; border-radius:8px; display:block; margin-bottom:6px; border:1px solid rgba(255,255,255,.4); }
        .msg .card { margin-top:8px; background: var(--blue-pale); border:1px solid #bfdbfe; border-radius:10px; padding:8px 10px; font-size:13.5px; }
        .msg .card div { padding:2px 0; } .msg .card b { color:var(--navy); }
        .typing { align-self:flex-start; color: var(--gray-500); font-size:13px; padding:2px 14px; }
        .typing i { display:inline-block; width:6px; height:6px; margin-right:3px; border-radius:50%; background: var(--blue-light); animation: maxBlink 1s ease-in-out infinite; }
        .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
        @keyframes pop { from { transform: translateY(6px); opacity:0; } to { transform:none; opacity:1; } }

        /* composer */
        .composer { position:sticky; bottom:0; background: var(--gray-50); padding-top:8px; }
        .row { display:flex; gap:8px; align-items:center; }
        .row input { flex:1; padding:13px 14px; border:1.5px solid var(--gray-200); border-radius:12px; font-family:inherit; font-size:16px; background:#fff; min-width:0; }
        .row input:focus { outline:none; border-color: var(--blue-light); box-shadow:0 0 0 3px rgba(59,130,246,.15); }
        button.b { padding:13px 18px; border:none; border-radius:12px; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; white-space:nowrap; transition: transform .15s, box-shadow .15s; }
        button.b:active { transform: translateY(1px); }
        button.b:disabled { opacity:.55; cursor:not-allowed; }
        .b.pri { background: linear-gradient(to right,#0f2a78 0%,#1d4ed8 60%,#2563eb 100%); color:#fff; box-shadow:0 1px 3px rgba(29,78,216,.35), 0 4px 14px -6px rgba(29,78,216,.6); }
        .b.ok { background: linear-gradient(to right,#024b36 0%,#059669 60%,#10b981 100%); color:#fff; box-shadow:0 1px 3px rgba(5,150,105,.35); }
        .b.sec { background:#fff; color: var(--gray-700); border:1.5px solid var(--gray-200); }
        .b.pur { background: linear-gradient(to right,#3b1a8c 0%,#7c3aed 60%,#8b5cf6 100%); color:#fff; }
        .b.big { width:100%; padding:15px 18px; font-size:16px; }
        .chips { display:flex; gap:8px; flex-wrap:wrap; }
        .chips .b { flex:1 1 auto; }
        .hdr .short { display:none; } @media (max-width: 480px) { .hdr .full { display:none; } .hdr .short { display:inline; font-size:16px; line-height:1; } }
        .consent { display:flex; gap:10px; align-items:flex-start; font-size:13px; color: var(--gray-700); background:#fff; border:1.5px solid var(--gray-200); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
        .consent input { width:20px; height:20px; flex:0 0 20px; margin-top:1px; accent-color: var(--blue); }
        .consent a { color: var(--blue); }
        .note { font-size:12px; color: var(--gray-500); text-align:center; margin-top:8px; }
        .note a { color: var(--blue); }
        .done { text-align:center; padding:30px 10px; }
        .done .big-check { width:72px; height:72px; border-radius:50%; margin:0 auto 14px; background: linear-gradient(135deg,#059669,#10b981); color:#fff; font-size:40px; line-height:72px; box-shadow:0 10px 24px -10px rgba(5,150,105,.7); }
        .done h2 { font-family:'Plus Jakarta Sans','Inter',sans-serif; color: var(--navy); font-size:22px; margin-bottom:8px; }
        .done p { color: var(--gray-700); font-size:15px; line-height:1.5; }
        .spin { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation: spin .8s linear infinite; vertical-align:-2px; margin-right:6px; }
        @keyframes spin { to { transform: rotate(360deg);} }
        @media (prefers-color-scheme: dark) { /* keep light: brand look */ }
    </style>
</head>
<body>
<div class="hdr">
    <img src="/icon.png" alt="UIB">
    <div class="txtblk"><div class="t">MAX <span style="font-weight:500;opacity:.8;">by UIB</span></div><div class="s">Universal Insurance Brokers · Quick car quote</div></div>
    <div class="spacer"></div>
    <button type="button" class="dealer" onclick="MaxLead.dealerSignup()">🤝 Dealer sign up</button>
    <button type="button" class="restart" onclick="MaxLead.restart()" title="Start over"><span class="full">Start over</span><span class="short">↺</span></button>
</div>

<div class="wrap">
    <div class="hero">
        <div class="max-bot" id="bot" aria-hidden="true">
            <div class="antenna"><span></span></div>
            <div class="head"><div class="visor"><span class="eye"></span><span class="eye"></span></div><div class="mouth"></div></div>
            <div class="neck"></div>
            <div class="body"><div class="core"></div></div>
        </div>
        <div class="txt"><b>Get a car insurance quote in 2 minutes</b><span>Snap your license and VIN. A licensed agent calls you back with the best rates.</span></div>
    </div>
    <div class="steps" id="steps"></div>

    <div class="log" id="log"></div>

    <div class="composer" id="composer"></div>
    <div class="note">Your details are sent only to Universal Insurance Brokers. <a href="/max/privacy">Privacy policy</a> · Auto dealer? <a href="#" onclick="MaxLead.dealerSignup();return false;">Sign up to refer customers</a></div>
    <input type="file" id="file" accept="image/*" capture="environment" style="display:none;" onchange="MaxLead.fileChosen(this)">
</div>

<script src="/max/max.js?v=20261006b"></script>
</body>
</html>
